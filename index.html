<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="HhuSB2fDTRhAe9mzmyd_brrq52RW0Gc5zlyOiAdfRI4" />
  <title>KING AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    header { background-color: #1e293b; padding: 16px 24px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.25rem; color: #38bdf8; font-weight: 700; }
    #chat-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; }
    .user-message { align-self: flex-end; background-color: #0284c7; color: #fff; border-bottom-right-radius: 2px; }
    .bot-message { align-self: flex-start; background-color: #1e293b; color: #e2e8f0; border-bottom-left-radius: 2px; border: 1px solid #334155; }
    #input-container { padding: 16px 24px; background-color: #1e293b; border-top: 1px solid #334155; display: flex; gap: 12px; }
    input[type="text"] { flex: 1; background-color: #0f172a; border: 1px solid #334155; padding: 12px 16px; border-radius: 8px; color: #fff; outline: none; font-size: 1rem; }
    input[type="text"]:focus { border-color: #38bdf8; }
    button { background-color: #0284c7; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: #0369a1; }
    #api-key-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-content { background: #1e293b; padding: 24px; border-radius: 12px; max-width: 400px; width: 100%; border: 1px solid #334155; }
    .modal-content h2 { margin-bottom: 12px; font-size: 1.2rem; color: #38bdf8; }
    .modal-content p { font-size: 0.875rem; color: #94a3b8; margin-bottom: 16px; }
  </style>
</head>
<body>

  <header>
    <h1>KING AI</h1>
    <button onclick="openKeyModal()" style="padding: 6px 12px; font-size: 0.8rem; background-color: #334155;">API Key</button>
  </header>

  <div id="chat-container">
    <div class="message bot-message">Hello! I am KING AI. How can I assist you today?</div>
  </div>

  <div id="input-container">
    <input type="text" id="user-input" placeholder="Type your message..." onkeypress="handleKeyPress(event)" />
    <button onclick="sendMessage()">Send</button>
  </div>

  <div id="api-key-modal">
    <div class="modal-content">
      <h2>Enter Gemini API Key</h2>
      <p>Please enter your Google AI Studio API key to enable KING AI responses.</p>
      <input type="text" id="api-key-input" placeholder="AIzaSy..." style="width: 100%; margin-bottom: 12px;" />
      <button onclick="saveApiKey()" style="width: 100%;">Save & Continue</button>
    </div>
  </div>

  <script>
    let apiKey = localStorage.getItem('KING_AI_KEY') || '';

    if (apiKey) {
      document.getElementById('api-key-modal').style.display = 'none';
    }

    function saveApiKey() {
      const key = document.getElementById('api-key-input').value.trim();
      if (key) {
        apiKey = key;
        localStorage.setItem('KING_AI_KEY', key);
        document.getElementById('api-key-modal').style.display = 'none';
      }
    }

    function openKeyModal() {
      document.getElementById('api-key-input').value = apiKey;
      document.getElementById('api-key-modal').style.display = 'flex';
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const message = input.value.trim();
      if (!message) return;

      if (!apiKey) {
        openKeyModal();
        return;
      }

      appendMessage(message, 'user-message');
      input.value = '';

      const loadingId = appendMessage('Thinking...', 'bot-message');

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: message }] }]
          })
        });

        const data = await response.json();
        const botReply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Sorry, I could not process that request.';
        document.getElementById(loadingId).innerText = botReply;
      } catch (err) {
        document.getElementById(loadingId).innerText = 'Error connecting to API. Please check your API key.';
      }
    }

    function appendMessage(text, className) {
      const container = document.getElementById('chat-container');
      const msgDiv = document.createElement('div');
      const id = 'msg-' + Date.now();
      msgDiv.id = id;
      msgDiv.className = `message ${className}`;
      msgDiv.innerText = text;
      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
      return id;
    }
  </script>
</body>
</html>
